[project]
name = "testfixer"
version = "0.1.0"
description = "Multi-agent system for fixing flaky automation test cases using CrewAI"
requires-python = ">=3.11"
dependencies = [
    "crewai>=1.0.0",
    "mcp>=1.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.28.0",
    "sentence-transformers>=3.0.0",
    "litellm>=1.0.0",
    "streamlit>=1.40.0",
]

[project.scripts]
testfixer = "testfixer.main:run_cli"
testfixer-ui = "testfixer.ui:main"

[tool.vercel]
entrypoint = "main.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/testfixer"]
